{% extends "base.html" %}
{% block title %}Add Property - EstateHub{% endblock %}
{% block content %}
<div class="container my-5"><div class="row justify-content-center"><div class="col-lg-9"><div class="form-card">
<h2 class="gradient-text mb-4">Add New Property</h2>
<form method="POST" enctype="multipart/form-data" id="addPropertyForm"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3">
<div class="col-12"><label class="form-label">Property Title *</label><input type="text" name="title" class="form-control" required></div><div class="col-12"><label class="form-label">Description *</label><textarea name="description" class="form-control" rows="4" required></textarea></div>
<div class="col-md-4"><label class="form-label">Property Type *</label><select name="property_type" class="form-select" required><option value="">Select type</option>{% for type in property_types %}<option value="{{ type }}">{{ type }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Price *</label><input type="number" name="price" class="form-control" min="0" step="0.01" required></div><div class="col-md-4"><label class="form-label">Currency *</label><select name="currency" class="form-select">{% for currency in currencies %}<option value="{{ currency }}" {% if currency == 'NPR' %}selected{% endif %}>{{ currency }}</option>{% endfor %}</select></div>
<div class="col-12"><label class="form-label">Street Address *</label><input type="text" name="address" class="form-control" required></div><div class="col-md-4"><label class="form-label">City *</label><select name="city" class="form-select" required><option value="">Select city</option>{% for city in cities %}<option value="{{ city }}">{{ city }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">State/Province</label><input type="text" name="state" class="form-control" value="Bagmati"></div><div class="col-md-4"><label class="form-label">Zip Code</label><input type="text" name="zipcode" class="form-control"></div>
<div class="col-md-4"><label class="form-label">Bedrooms</label><input type="number" name="bedrooms" class="form-control" min="0"></div><div class="col-md-4"><label class="form-label">Bathrooms</label><input type="number" name="bathrooms" class="form-control" min="0"></div><div class="col-md-4"><label class="form-label">Area (sq ft)</label><input type="number" name="area" class="form-control" step="0.01" min="0"></div>
<div class="col-12"><label class="form-label">Property Image</label><input type="file" name="image" class="form-control" accept="image/png,image/jpeg,image/gif,image/webp" onchange="previewImage(this)"><small class="text-muted">PNG, JPG, GIF, or WebP; maximum 16 MB.</small><div id="imagePreview" class="mt-3"></div></div><div class="col-12 d-flex gap-2"><button type="submit" class="btn btn-submit w-auto"><i class="fas fa-plus-circle me-2"></i>Add Property</button><a href="{{ url_for('main.agent_dashboard') }}" class="btn btn-outline-secondary">Cancel</a></div>
</div></form></div></div></div></div>
{% endblock %}{% block extra_js %}<script>function previewImage(input){const preview=document.getElementById('imagePreview');preview.replaceChildren();if(input.files[0]){const image=document.createElement('img');image.src=URL.createObjectURL(input.files[0]);image.alt='Selected property image preview';image.className='img-fluid rounded';image.style.maxHeight='240px';preview.appendChild(image);}}</script>{% endblock %}
